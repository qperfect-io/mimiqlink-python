[project]
name = "mimiqlink"
version = "0.9.0"
description = "Core client library for the QPerfect MIMIQ Cloud API"
authors = [{ name = "Guido Masella", email = "guido.masella@qperfect.io" }]
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
    "requests (>=2.34,<3)",
    "python-keycloak (>=4.7,<5)",
    "tabulate (>=0.10,<0.11)",
]
license = "Apache-2.0"

[project.urls]
Documentation = "https://docs.qperfect.io"
Repository = "https://github.com/qperfect-io/mimiqlink-python"

[tool.poetry]
packages = [{ include = "mimiqlink", from = "src" }]

[dependency-groups]
test = ["pytest (>=9.1,<10)", "responses (>=0.26,<0.27)"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
